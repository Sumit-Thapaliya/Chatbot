<!doctype html>
<html lang="en" class="embed" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>School ERP Assistant · chat</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/widget-theme.css" />
<script>
  (function () {
    try {
      var asked = new URLSearchParams(location.search).get('theme');
      window.CBW = { embed: true, theme: asked };
      var t = (asked === 'dark' || asked === 'light') ? asked
            : (localStorage.getItem('chatbot.theme') || localStorage.getItem('astra.theme'));
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>


<main class="app" data-theme="light" aria-label="Chat">

  <div class="thread" id="thread">
    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="typing hidden" id="typing">
      <span class="bot-av"><span class="art art-dark"></span><span class="art art-light"></span></span>
      <span class="typing-bubble"><span class="dots"><i></i><i></i><i></i></span><span class="think">Thinking…</span></span>
    </div>
  </div>

  <footer class="dock">
    <form class="composer" id="composer">
      <textarea id="msgInput" rows="1" placeholder="Ask about School ERP…" aria-label="Message" autocomplete="off"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Send message">
        <svg class="ic-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10.5 13.5M21 3l-6.8 18-3.7-7.5L3 9.8 21 3Z"/></svg>
        <svg class="ic-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
      </button>
    </form>
  </footer>
</main>


<div hidden aria-hidden="true">
  <div id="ripples"></div>
  <button id="themeToggle" type="button"></button>
  <button id="connPill" type="button"><span id="connLabel"></span></button>
  <div id="connPopover">
    <button id="popClose" type="button"></button>
    <input id="keyInput" type="text" />
    <button id="eyeBtn" type="button"></button>
    <input id="modelInput" type="text" />
    <div id="popResult"></div>
    <button id="saveBtn" type="button"></button>
    <button id="testBtn" type="button"></button>
  </div>
  <div id="toast"></div>
</div>

<script src="/app.js" defer></script>
<script src="/widget-theme.js" defer></script>
</body>
</html>
